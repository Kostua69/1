<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Blog</title>
	<style>
		/* Форма блогу */
		form {
            background: white;
            width: 320px;
            margin: 60px auto;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        form input[type="text"] {
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 5px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        form input[type="text"]:focus {
            border-color: #04AA6D;
            box-shadow: 0 0 5px rgba(4,170,109,0.4);
            outline: none;
        }

        form input[type="submit"] {
            background: #04AA6D;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;

            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        form input[type="submit"]:hover {
            background-color: #038d5c;
            transform: scale(1.05);
        }

        p {
            text-align: center;
            margin-top: 10px;
        }

        p a {
            color: #04AA6D;
            text-decoration: none;
        }

        p a:hover {
            text-decoration: underline;
        }
	</style>
	<script>
    var socket = io();

    socket.on('new_post', function(data) {
        console.log("New post:", data);

        // приклад — просто alert
        alert("New article: " + data.name);
    });
	</script>
</head>
<body>
{% extends "layout.html" %}
{% block content %}

<form name="blog" method="POST" action="/blog">
	<label>Article name:</label>
	<input type="text" name="article_name">

	<label>Date of writing:</label>
	<input type="text" name="writing_date">

	<label>Author:</label>
	<input type="text" name="article_author">

	<label>Topic of aricle:</label>
	<input type="text" name="aritcle_topic">

	<label>Text of article:</label>
	<input type="text" name="article_text">

	<input type="submit" value="Blog">
</form>

{% endblock %}
</body>
</html>
