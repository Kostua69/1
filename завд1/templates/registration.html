<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registration</title>

<style>
        /* Форма реєстрації */
        form {
            background: white;
            width: 320px;
            margin: 60px auto;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        form input[type="text"],
        form input[type="password"],
        form input[type="email"] {
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 5px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        form input[type="text"]:focus,
        form input[type="password"]:focus,
        form input[type="email"]:focus {
            border-color: #04AA6D;
            box-shadow: 0 0 5px rgba(4,170,109,0.4);
            outline: none;
        }

        form input[type="submit"] {
            background: #04AA6D;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;

            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        form input[type="submit"]:hover {
            background-color: #038d5c;
            transform: scale(1.05);
        }

        p {
            text-align: center;
            margin-top: 10px;
        }

        p a {
            color: #04AA6D;
            text-decoration: none;
        }

        p a:hover {
            text-decoration: underline;
        }
</style>
</head>

<body>

{% extends "layout.html" %} {% block content %}

<!-- Форма реєстрації -->
<form name="registration" method="POST" action="/registration">

    <label>Username:</label>
    <input type="text" name="username" required placeholder="Username">

    <label>Password:</label>
    <input type="password" name="password" required placeholder="Password">

    <label>First name:</label>
    <input type="text" name="firstname" required placeholder="Firstname">

    <label>Last name:</label>
    <input type="text" name="lastname" required placeholder="Lastname">

    <label>Email:</label>
    <input type="email" name="email" required placeholder="Email">

    <label>Age:</label>
    <input type="text" name="age" required placeholder="Age">

    <input type="submit" value="Registration">
</form>

<p>You already have an account? <a href="/login">Login</a></p>

{% endblock %}
</body>
</html>
