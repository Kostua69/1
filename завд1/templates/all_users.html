<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>All Users</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f0f0f0;
    }

/* Навігація */
.navbar {
        background-color: #333;
        overflow: hidden;
    }

.navbar a {
        float: left;
        display: block;
        color: #f2f2f2;
        text-align: center;
        padding: 14px 20px;
        text-decoration: none;
        font-size: 17px;
        transition: background-color 0.3s ease, transform 0.2s ease;
    }

.navbar a:hover {
        background-color: #575757;
        transform: scale(1.07);
    }

.navbar a.active {
        background-color: #04AA6D;
    }
    /* Контейнер */
.container2 {
    width: 80%;
    margin: 40px auto;
    background: white;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.15);
}

h1 {
    margin-top: 0;
    color: #333;
}

ul {
    list-style: none;
    padding-left: 0;
    margin-top: 20px;
}

li {
    background: #eee;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 5px;

    transition: background-color 0.2s ease, transform 0.2s ease;
}

li:hover {
    background-color: #ddd;
    transform: scale(1.02);
}

li a {
    text-decoration: none;
    color: #04AA6D;
    font-weight: bold;

    transition: color 0.2s ease;
}

li a:hover {
    color: #038d5c;
    text-decoration: underline;
}

    /* Годинник */
.clock {
     font-size: 17px;
     float: left;
     display: block;
     color: #f2f2f2;
     text-align: center;
     padding: 14px 20px;
     text-decoration: none;
     transition: background-color 0.3s ease, transform 0.2s ease;
</style>
</head>

<body>

{% extends "layout.html" %} {% block content %}

<!-- Контейнер -->
<div class="container2">
    <h1>All Users</h1>

    <ul>
        {% for user in users %}
            <li>
                <a href="{{ url_for('user', UserName=user.UserName) }}">
                    {{ user.UserName }}
                </a>
                — {{ user.FirstName }} {{ user.LastName }} — Age: {{ user.Age }}
            </li>
        {% endfor %}
    </ul>
</div>

{% endblock %}
</body>
</html>
